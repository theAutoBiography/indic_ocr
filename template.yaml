AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Drishti OCR Lambda Function with API Gateway

Parameters:
  ECRImageUri:
    Type: String
    Description: ECR Image URI for the Lambda function

  S3WordBucket:
    Type: String
    Default: ocr-word-images
    Description: S3 bucket for word images

  S3CharBucket:
    Type: String
    Default: ocr-char-images
    Description: S3 bucket for character images

  DynamoDBTable:
    Type: String
    Default: ocr-results
    Description: DynamoDB table name for OCR results

Resources:
  # S3 Buckets
  WordImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3WordBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CharImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3CharBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # DynamoDB Table
  OCRResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: file_id-index
          KeySchema:
            - AttributeName: file_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DrishtiOCRLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DrishtiOCRPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${WordImagesBucket.Arn}/*'
                  - !Sub '${CharImagesBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt OCRResultsTable.Arn
                  - !Sub '${OCRResultsTable.Arn}/index/*'

  # Lambda Function
  DrishtiOCRFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DrishtiOCR
      PackageType: Image
      ImageUri: !Ref ECRImageUri
      Timeout: 900
      MemorySize: 3008
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
          S3_WORD_BUCKET: !Ref S3WordBucket
          S3_CHAR_BUCKET: !Ref S3CharBucket
          DYNAMODB_TABLE: !Ref DynamoDBTable
          UPLOAD_FOLDER: /tmp/uploads
          TESSERACT_LANG: san+eng+hin
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Lambda Function URL (Alternative to API Gateway)
  DrishtiOCRFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt DrishtiOCRFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        AllowHeaders:
          - '*'

  DrishtiOCRFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DrishtiOCRFunction
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'

  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt DrishtiOCRFunctionUrl.FunctionUrl

  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt DrishtiOCRFunction.Arn

  WordImagesBucketName:
    Description: S3 Bucket for word images
    Value: !Ref WordImagesBucket

  CharImagesBucketName:
    Description: S3 Bucket for character images
    Value: !Ref CharImagesBucket

  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref OCRResultsTable
